<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Digestube v2 — 빌드 화면</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #EEF1F5; --surface: #FFFFFF; --surface-2: #E4E9F0;
    --ink: #1A2233; --muted: #5B6472; --faint: #8A93A3; --line: #D2D9E2;
    --blue: #2454A6; --blue-soft: #E4ECFB;
    --green: #2E7D5B; --green-soft: #E4F3EC;
    --red: #B3432F; --red-soft: #FBEAE6;
    --amber: #B8681E; --amber-soft: #FBEEDE;
    --code-bg: #101826; --code-ink: #D7DEEA;
    --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 32px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D131D; --surface: #151D2B; --surface-2: #1C2635;
      --ink: #E3E8F0; --muted: #9AA5B6; --faint: #6C7688; --line: #2A3446;
      --blue: #7FA8F0; --blue-soft: #1B2A47;
      --green: #6FCBA0; --green-soft: #12271E;
      --red: #E38070; --red-soft: #33140F;
      --amber: #E3A34E; --amber-soft: #33270F;
      --code-bg: #0A0F18; --code-ink: #D7DEEA;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system,"Apple SD Gothic Neo",system-ui,sans-serif; font-size: 14.5px; }
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; height: auto; } }

  .notes-panel { border-right: 1px solid var(--line); overflow-y: auto; background: var(--surface); }
  .notes-panel header { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
  .notes-panel h1 { font-size: 15px; margin: 0 0 4px; }
  .notes-panel p { font-size: 12px; color: var(--muted); margin: 0; }
  .tabs { display: flex; flex-direction: column; padding: 8px; gap: 2px; }
  .tabs button { text-align: left; background: none; border: none; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .tabs button:hover { background: var(--surface-2); }
  .tabs button.active { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .note-body { padding: var(--sp-1) 18px 30px; font-size: 13px; line-height: 1.7; }
  .note-body > *:first-child { margin-top: 0 !important; }
  .note-body h1 { font-size: 17px; margin: var(--sp-4) 0 var(--sp-1); }
  .note-body h2 { font-size: 14.5px; margin: var(--sp-3) 0 var(--sp-1); color: var(--blue); }
  .note-body p { margin: var(--sp-2) 0; color: var(--ink); }
  .note-body ul, .note-body ol { padding-left: 18px; margin: var(--sp-2) 0; }
  .note-body li { margin: var(--sp-1) 0; }
  .note-body code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .note-body table { border-collapse: collapse; width: 100%; margin: var(--sp-2) 0; font-size: 12px; }
  .note-body th, .note-body td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; }
  .note-body th { color: var(--faint); font-size: 10.5px; text-transform: uppercase; }
  .note-body strong { color: var(--ink); }
  .note-body a { color: var(--blue); text-decoration: none; border-bottom: 1px solid var(--blue-soft); }
  .note-body a:hover { border-bottom-color: var(--blue); }
  .note-body blockquote { margin: var(--sp-2) 0; padding: 12px 16px; background: var(--blue-soft); border-left: 3px solid var(--blue); border-radius: 0 8px 8px 0; }
  .note-body blockquote p { margin: 0; }
  .note-body blockquote .tldr-label { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--blue); text-transform: uppercase; margin-bottom: 4px; }

  .funnel { display: flex; flex-direction: column; gap: var(--sp-2); margin: var(--sp-2) 0; }
  .funnel-row { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 12px; }
  .funnel-track { width: 100%; }
  .funnel-bar { background: var(--blue); border-radius: 6px; height: 28px; display: flex; align-items: center; justify-content: center; transition: width .3s; min-width: 32px; }
  .funnel-n { color: white; font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .funnel-label { font-size: 12.5px; color: var(--ink); min-width: 0; }
  .funnel-reasons { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 3px; }
  .funnel-reason { font-size: 11px; color: var(--faint); }
  .funnel-tag { font-size: 9.5px; font-weight: 700; letter-spacing: .02em; padding: 1px 6px; border-radius: 100px; }
  .funnel-tag.exclude { background: var(--red-soft); color: var(--red); }
  .funnel-tag.defer { background: var(--amber-soft); color: var(--amber); }
  .funnel-tag.merge { background: var(--blue-soft); color: var(--blue); }
  .funnel-tag.result { background: var(--green-soft); color: var(--green); }
  .funnel-note { font-size: 11px; color: var(--muted); margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--line); }
  .funnel-note + .funnel-note { margin-top: 2px; }

  .roster { display: flex; flex-direction: column; gap: 3px; margin: var(--sp-2) 0; }
  .roster-group { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; color: var(--faint); text-transform: uppercase; margin-top: var(--sp-2); padding-bottom: 2px; border-bottom: 1px solid var(--line); }
  .roster-group:first-child { margin-top: 0; }
  .roster-item { display: grid; grid-template-columns: 190px 1fr; align-items: baseline; gap: 4px 10px; padding: 5px 8px; border-radius: 6px; font-size: 12px; }
  .roster-item.test { background: var(--blue-soft); }
  .roster-item.done { background: var(--green-soft); }
  .roster-head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .roster-name { color: var(--ink); }
  .roster-item.exclude .roster-name, .roster-item.merge .roster-name, .roster-item.defer .roster-name {
    color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1.5px;
  }
  .roster-item.exclude .roster-name { text-decoration-color: var(--red); }
  .roster-item.merge .roster-name { text-decoration-color: var(--blue); }
  .roster-item.defer .roster-name { text-decoration-color: var(--amber); }
  .roster-badge { font-size: 9px; font-weight: 700; letter-spacing: .02em; padding: 1px 6px; border-radius: 100px; }
  .roster-badge.exclude { background: var(--red-soft); color: var(--red); }
  .roster-badge.merge { background: var(--blue-soft); color: var(--blue); }
  .roster-badge.defer { background: var(--amber-soft); color: var(--amber); }
  .roster-badge.test { background: var(--blue); color: white; }
  .roster-badge.done { background: var(--green); color: white; }
  .roster-note { font-size: 11px; color: var(--muted); min-width: 0; }
  @media (max-width: 620px) { .roster-item { grid-template-columns: 1fr; } }

  .build-panel { padding: var(--sp-4); overflow-y: auto; display: flex; flex-direction: column; gap: var(--sp-4); }
  .panel-head { display: flex; flex-direction: column; gap: var(--sp-1); }
  .build-panel h1 { font-size: 20px; margin: 0; }
  .build-panel .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: var(--sp-3) var(--sp-3); max-width: 560px; display: flex; flex-direction: column; gap: var(--sp-2); }
  .card label { display: block; font-size: 11.5px; font-weight: 700; color: var(--faint); text-transform: uppercase; margin-bottom: var(--sp-1); }
  .row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 13.5px; }
  button.go { padding: 9px 16px; border: none; border-radius: 8px; background: var(--blue); color: white; font-weight: 600; font-size: 13px; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: default; }
  .result { padding: 14px 16px; border-radius: 10px; font-size: 13px; }
  .result.ok { background: var(--green-soft); }
  .result.err { background: var(--red-soft); color: var(--red); }
  .result dl { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; margin: 0; }
  .result dt { color: var(--muted); }
  .result dd { margin: 0; }
  .result audio { width: 100%; margin-top: 12px; }
  a.dl { display: inline-block; margin-top: 10px; font-size: 12.5px; color: var(--blue); text-decoration: none; }
  a.dl:hover { text-decoration: underline; }
  .note-ptr { margin: 10px 0 0; font-size: 11.5px; color: var(--muted); }

  .steps { display: flex; flex-direction: column; gap: 0; }
  .step { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 12.5px; color: var(--faint); }
  .step .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); color: var(--faint); font-size: 11px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; transition: background .2s, color .2s; }
  .step.active { color: var(--ink); }
  .step.active .dot { background: var(--blue-soft); color: var(--blue); }
  .step.done { color: var(--ink); }
  .step.done .dot { background: var(--green-soft); color: var(--green); }

  .current-video { background: var(--green-soft); border: 1px solid var(--green); border-radius: 12px; padding: var(--sp-3); max-width: 560px; }
  .cv-label { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .02em; margin-bottom: var(--sp-1); }
  .cv-body { font-size: 13.5px; }
  .cv-body .cv-title { font-weight: 600; margin-bottom: 2px; }
  .cv-body .cv-sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .cv-body audio { width: 100%; height: 32px; }
  .cv-reset { margin-top: 10px; background: none; border: none; color: var(--muted); font-size: 11.5px; text-decoration: underline; cursor: pointer; padding: 0; }

  .reqlog-wrap { max-width: 560px; }
  .reqlog-label { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .02em; margin-bottom: var(--sp-1); }
  .reqlog { background: var(--code-bg); border-radius: 10px; padding: 4px 0; font-family: ui-monospace,"SF Mono",Consolas,monospace; font-size: 11.5px; max-height: 220px; overflow-y: auto; }
  .reqlog-empty { color: var(--faint); padding: 10px 14px; margin: 0; }
  .req-row { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-bottom: 1px solid rgba(255,255,255,.06); color: var(--code-ink); }
  .req-row:last-child { border-bottom: none; }
  .req-method { flex-shrink: 0; width: 34px; font-weight: 700; }
  .req-method.get { color: var(--code-blue); }
  .req-method.post { color: var(--code-amber); }
  .req-path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  .req-desc { opacity: .6; }
  .req-status { flex-shrink: 0; font-weight: 700; }
  .req-status.pending { color: var(--code-amber); }
  .req-status.ok { color: var(--green); }
  .req-status.err { color: var(--red); }
  .req-ms { flex-shrink: 0; color: var(--faint); width: 46px; text-align: right; }
</style>
</head>
<body>
<div class="app">
  <div class="notes-panel">
    <header>
      <h1>Digestube v2 · 판단 기록</h1>
      <p>왜 이 기술을 골랐는지, 옆에서 계속 보면서 만든다</p>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="note-body" id="noteBody">불러오는 중...</div>
  </div>

  <div class="build-panel">
    <div class="panel-head">
      <h1>1단계 — yt-dlp 오디오 추출</h1>
      <p class="sub">유튜브 URL을 넣으면, 왼쪽 노트에서 정한 그 도구·그 옵션 그대로 오디오를 뽑아낸다.</p>
    </div>
    <div class="card">
      <div class="field">
        <label>유튜브 URL</label>
        <div class="row">
          <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." />
          <button class="go" id="go">추출</button>
        </div>
      </div>
      <div class="steps" id="steps">
        <div class="step" data-s="1"><span class="dot">1</span>URL 입력</div>
        <div class="step" data-s="2"><span class="dot">2</span>yt-dlp 실행 (android 클라이언트 우회)</div>
        <div class="step" data-s="3"><span class="dot">3</span>오디오 파일(.m4a) 추출 완료</div>
      </div>
      <div id="result"></div>
    </div>

    <div class="current-video" id="currentVideo" style="display:none">
      <div class="cv-label">현재 작업 영상 — 앞으로 만들 단계(전사·청킹 등)가 다 이 영상 기준으로 이어짐</div>
      <div class="cv-body" id="cvBody"></div>
      <button class="cv-reset" id="cvReset">다른 영상으로 바꾸기</button>
    </div>

    <div class="reqlog-wrap">
      <div class="reqlog-label">API 요청 로그 — 지금 뭐가 오가는지</div>
      <div class="reqlog" id="reqlog"><p class="reqlog-empty">아직 없음</p></div>
    </div>
  </div>
</div>

<script>
const API = "http://127.0.0.1:8010";

function mdToHtml(md) {
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines = md.split("\n");
  let html = "", inList = false, inTable = false, tableRows = [], inFunnel = false, funnelRows = [], inRoster = false, rosterRows = [];

  // ```funnel 블록 안의 "숫자|라벨|사유(선택)" 줄을 깔때기 모양 막대로 그린다.
  // 순차 소거 과정(18개 → 15개 → 4개 식)을 표로 나열하는 것보다 한눈에 들어온다.
  const FUNNEL_TAGS = { "제외": "exclude", "보류": "defer", "합침": "merge", "결과": "result" };
  function funnelReasonHtml(reason) {
    if (!reason) return "";
    // "제외: A·B; 보류: C·D" 처럼 세미콜론으로 구분된 여러 태그를 각각 다른 색 칩으로 그린다.
    // 태그 없는 문장은 그냥 회색 문장으로 나온다.
    return reason.split(";").map(part => {
      const m = part.match(/^\s*(제외|보류|합침|결과)\s*:\s*(.+)$/);
      if (!m) return `<span class="funnel-reason">${inline(part.trim())}</span>`;
      const cls = FUNNEL_TAGS[m[1]];
      return `<span class="funnel-tag ${cls}">${m[1]}</span><span class="funnel-reason">${inline(m[2].trim())}</span>`;
    }).join(" ");
  }
  function flushFunnel() {
    if (!funnelRows.length) return;
    const max = Math.max(...funnelRows.map(r => r.n));
    html += '<div class="funnel">';
    funnelRows.forEach(r => {
      const pct = Math.max(18, Math.round((r.n / max) * 100));
      const notesHtml = (r.notes || []).map(n => `<div class="funnel-note">${inline(n)}</div>`).join("");
      html += `<div class="funnel-row">
        <div class="funnel-track"><div class="funnel-bar" style="width:${pct}%"><span class="funnel-n">${r.n}</span></div></div>
        <div class="funnel-label">${inline(r.label)}<span class="funnel-reasons">${funnelReasonHtml(r.reason)}</span>${notesHtml}</div>
      </div>`;
    });
    html += '</div>';
    funnelRows = [];
  }

  // ```roster 블록: "이름|상태|비고" 한 줄씩 = 후보 전원을 이름 그대로 나열하고
  // 상태(exclude/merge/defer/test/done)에 따라 취소선·색을 다르게 준다.
  // 퍼널이 "몇 개가 몇 개로 줄었다"는 흐름이라면, 이건 "누가 어떻게 됐다"를 이름으로 바로 보여준다.
  // "# 카테고리명" 줄을 넣으면 그 아래 항목들이 한 묶음으로 나온다. 후보 명단과
  // 소거 결과를 따로 적으면 같은 이름이 두 번 나오므로, 한 명단에 상태까지 함께 담는다.
  const ROSTER_LABEL = { exclude: "제외", merge: "합침", defer: "보류", test: "측정 대기", done: "측정 완료" };
  function flushRoster() {
    if (!rosterRows.length) return;
    html += '<div class="roster">';
    rosterRows.forEach(r => {
      if (r.group) { html += `<div class="roster-group">${inline(r.group)}</div>`; return; }
      const st = ROSTER_LABEL[r.status] ? r.status : "test";
      html += `<div class="roster-item ${st}">
        <span class="roster-head"><span class="roster-name">${inline(r.name)}</span><span class="roster-badge ${st}">${ROSTER_LABEL[st]}</span></span>
        ${r.note ? `<span class="roster-note">${inline(r.note)}</span>` : ""}
      </div>`;
    });
    html += '</div>';
    rosterRows = [];
  }

  function flushTable() {
    if (!tableRows.length) return;
    const [head, , ...body] = tableRows;
    const cells = r => r.split("|").slice(1, -1).map(c => c.trim());
    html += "<table><tr>" + cells(head).map(c => `<th>${c}</th>`).join("") + "</tr>";
    body.forEach(r => { html += "<tr>" + cells(r).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>"; });
    html += "</table>";
    tableRows = [];
  }
  function inline(s) {
    s = esc(s);
    s = s.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/`(.+?)`/g, "<code>$1</code>");
    return s;
  }
  for (const raw of lines) {
    const line = raw;
    if (/^```funnel/.test(line)) { inFunnel = true; continue; }
    if (inFunnel) {
      if (/^```/.test(line)) { inFunnel = false; flushFunnel(); continue; }
      // "↳ " 로 시작하면 숫자 줄이 아니라 바로 위 막대에 붙는 메모다(별도 문단으로
      // 안 빼고 흐름 안에서 바로 보이게 하려는 용도).
      if (/^\s*↳/.test(line)) {
        const last = funnelRows[funnelRows.length - 1];
        if (last) { last.notes = last.notes || []; last.notes.push(line.replace(/^\s*↳\s*/, "")); }
        continue;
      }
      const [n, label, reason] = line.split("|").map(s => s?.trim());
      if (n) funnelRows.push({ n: parseInt(n, 10), label, reason });
      continue;
    }
    if (/^```roster/.test(line)) { inRoster = true; continue; }
    if (inRoster) {
      if (/^```/.test(line)) { inRoster = false; flushRoster(); continue; }
      if (/^#\s+/.test(line)) { rosterRows.push({ group: line.replace(/^#\s+/, "") }); continue; }
      const [name, status, note] = line.split("|").map(s => s?.trim());
      if (name) rosterRows.push({ name, status, note });
      continue;
    }
    if (/^\|/.test(line)) { inTable = true; tableRows.push(line); continue; }
    else if (inTable) { flushTable(); inTable = false; }

    if (/^# /.test(line)) html += `<h1>${inline(line.slice(2))}</h1>`;
    else if (/^## /.test(line)) html += `<h2>${inline(line.slice(3))}</h2>`;
    else if (/^### /.test(line)) html += `<h2 style="font-size:13.5px">${inline(line.slice(4))}</h2>`;
    else if (/^>\s+/.test(line)) {
      let body = line.replace(/^>\s+/, "");
      let label = "";
      const m = body.match(/^\*\*(TL;?DR|요약)\*\*:?\s*/i);
      if (m) { label = m[1].toUpperCase(); body = body.slice(m[0].length); }
      html += `<blockquote>${label ? `<span class="tldr-label">${label}</span>` : ""}<p>${inline(body)}</p></blockquote>`;
    }
    else if (/^-\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inline(line.replace(/^-\s+/, ""))}</li>`;
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      if (/^\d+\.\s/.test(line)) html += `<p>${inline(line)}</p>`;
      else if (line.trim()) html += `<p>${inline(line)}</p>`;
    }
  }
  if (inList) html += "</ul>";
  flushTable();
  return html;
}

// API 요청 로그 — 지금 뭐가 오가는지 devtools 안 열어도 화면에서 보이게 한다.
let reqSeq = 0;
function logRequest(method, path, desc) {
  const log = document.getElementById("reqlog");
  log.querySelector(".reqlog-empty")?.remove();
  const id = `req-${++reqSeq}`;
  const row = document.createElement("div");
  row.className = "req-row";
  row.id = id;
  row.innerHTML = `<span class="req-method ${method.toLowerCase()}">${method}</span>
    <span class="req-path">${path}${desc ? `<span class="req-desc"> — ${desc}</span>` : ""}</span>
    <span class="req-status pending">진행중</span>
    <span class="req-ms"></span>`;
  log.prepend(row);
  const t0 = performance.now();
  return {
    ok(note) {
      const ms = Math.round(performance.now() - t0);
      row.querySelector(".req-status").className = "req-status ok";
      row.querySelector(".req-status").textContent = note || "200 OK";
      row.querySelector(".req-ms").textContent = `${ms}ms`;
    },
    err(note) {
      const ms = Math.round(performance.now() - t0);
      row.querySelector(".req-status").className = "req-status err";
      row.querySelector(".req-status").textContent = note || "실패";
      row.querySelector(".req-ms").textContent = `${ms}ms`;
    },
  };
}
// <audio src="..."> 로딩은 fetch()가 아니라 브라우저가 알아서 GET을 보내므로
// 직접 가로챌 수 없다. loadstart(요청 시작)·canplay(응답 받아 재생 준비됨)·
// error 이벤트로 대신 감지해서 로그에 남긴다.
function wireAudioLog(audio, path) {
  let log = null;
  audio.addEventListener("loadstart", () => { log = logRequest("GET", path, "추출된 오디오 파일 자체를 받아옴"); });
  audio.addEventListener("canplay", () => log?.ok("재생 준비됨"));
  audio.addEventListener("error", () => log?.err("로드 실패"));
}

// 지금 작업 중인 영상 — localStorage에 저장해서 새로고침해도, 나중에
// 2단계(전사)·3단계(청킹)를 만들어도 같은 영상 기준으로 이어서 볼 수 있게 한다.
const CV_KEY = "digestube_current_video";
function saveCurrentVideo(data) {
  localStorage.setItem(CV_KEY, JSON.stringify(data));
  renderCurrentVideo(data);
}
function loadCurrentVideo() {
  const raw = localStorage.getItem(CV_KEY);
  if (!raw) return;
  try { renderCurrentVideo(JSON.parse(raw)); } catch {}
}
function renderCurrentVideo(data) {
  const box = document.getElementById("currentVideo");
  const body = document.getElementById("cvBody");
  const audioUrl = `${API}/api/audio/${data.id}`;
  body.innerHTML = `
    <div class="cv-title">${data.title}</div>
    <div class="cv-sub">${data.channel ?? ""} · ${data.duration_sec ? Math.round(data.duration_sec) + "초" : ""} · ${data.audio_file}</div>
    <audio controls preload="none" src="${audioUrl}"></audio>
    <a class="dl" href="${audioUrl}" download="${data.audio_file}">오디오 파일 다운로드</a>`;
  box.style.display = "block";
  wireAudioLog(body.querySelector("audio"), `/api/audio/${data.id}`);
}
document.getElementById("cvReset").onclick = () => {
  localStorage.removeItem(CV_KEY);
  document.getElementById("currentVideo").style.display = "none";
};
loadCurrentVideo();

// 노트 선택 상태를 URL 해시(#02-stt)에 반영한다 — 새로고침해도 방금 보던
// 탭이 유지되고, 이 URL 자체를 그 노트로 가는 링크로도 쓸 수 있다.
let notes = [];
async function loadNotes() {
  notes = await (await fetch(`${API}/api/notes`)).json();
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = notes.map(n => `<button data-id="${n.id}">${n.title}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b => b.onclick = () => { location.hash = b.dataset.id; });
  const fromHash = location.hash.replace(/^#/, "");
  const startId = notes.find(n => n.id === fromHash)?.id
    || notes.find(n => n.id.includes("yt-dlp"))?.id
    || notes[0]?.id;
  if (startId) selectNote(startId);
}
window.addEventListener("hashchange", () => {
  const id = location.hash.replace(/^#/, "");
  if (notes.find(n => n.id === id)) selectNote(id);
});
async function selectNote(id) {
  if (location.hash.replace(/^#/, "") !== id) location.hash = id;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  const log = logRequest("GET", `/api/notes/${id}`, "왼쪽 노트 내용 불러오기");
  const r = await fetch(`${API}/api/notes/${id}`);
  const { content } = await r.json();
  log.ok(`${r.status}`);
  document.getElementById("noteBody").innerHTML = mdToHtml(content);
}
loadNotes();

document.getElementById("go").onclick = async () => {
  const url = document.getElementById("url").value.trim();
  const btn = document.getElementById("go");
  const out = document.getElementById("result");
  if (!url) return;
  const steps = document.querySelectorAll("#steps .step");
  const setStep = (n, cls) => {
    steps.forEach(s => s.classList.remove("active", "done"));
    steps.forEach(s => { if (+s.dataset.s < n) s.classList.add("done"); });
    if (cls) steps[n - 1]?.classList.add(cls);
  };
  setStep(1, "done");
  btn.disabled = true; btn.textContent = "추출 중...";
  out.innerHTML = "";
  try {
    setStep(2, "active");
    const log = logRequest("POST", "/api/extract", "yt-dlp 실행해서 오디오 추출");
    const r = await fetch(`${API}/api/extract`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    const data = await r.json();
    if (!r.ok) { log.err(`${r.status}`); throw new Error(data.detail || "실패"); }
    log.ok(`${r.status} · yt-dlp 완료`);
    setStep(3, "done"); steps[2]?.classList.add("done");
    saveCurrentVideo(data);
    out.innerHTML = `<div class="result ok"><dl>
      <dt>제목</dt><dd>${data.title}</dd>
      <dt>채널</dt><dd>${data.channel}</dd>
      <dt>길이</dt><dd>${data.duration_sec ? Math.round(data.duration_sec) + "초" : "-"}</dd>
      <dt>파일</dt><dd>${data.audio_file} (${data.size_kb} KB)</dd>
    </dl>
    <p class="note-ptr">↑ 위 "현재 작업 영상" 카드에서 바로 재생·다운로드할 수 있음 — 플레이어를 두 번 안 그림</p>
    </div>`;
  } catch (e) {
    out.innerHTML = `<div class="result err">${e.message}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "추출";
  }
};
</script>
