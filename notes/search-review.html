<main><h1>검색 질문, 마지막 확인</h1><p>질문이 자연스럽고 근거가 맞으면 <b>괜찮음</b>. 바꿀 부분은 <b>수정 필요</b>를 누르고 메모를 남겨줘.</p><p class="muted">전사문으로 만든 초안이야. 검색 결과는 아직 보지 않았어. 영상 링크에서 해당 대목도 확인할 수 있어.</p>

<script>
const original=JSON.parse(document.querySelector('#dataset').textContent);
const key='digestube-review-a225a086424eff7ec3ddd5b38175aca4f5c8c702f7473c023b4d9fb2445c858b';let decisions={},index=0;
try{decisions=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
const $=s=>document.querySelector(s);
const time=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function persist(){try{localStorage.setItem(key,JSON.stringify(decisions))}catch{$('#notice').textContent='브라우저 임시 저장이 안 돼. 검수 내용 저장 버튼으로 파일을 받아줘.'}}
function state(q){return decisions[q.id]||{status:'pending',memo:''}}
function render(){
 const q=original.questions[index],d=state(q);
 const completed=original.questions.filter(q=>state(q).status!=='pending').length;
 const approved=original.questions.filter(q=>state(q).status==='approved').length;
 $('#progress-text').textContent=`${completed} / ${original.questions.length}개 확인 · 괜찮음 ${approved}개 · 수정 필요 ${completed-approved}개`;
 $('#progress').max=original.questions.length;$('#progress').value=completed;
 $('#position').textContent=`${index+1} / ${original.questions.length}`;
 $('#prev').disabled=index===0;$('#next').disabled=index===original.questions.length-1;
 $('#tag').textContent=q.id+' · '+(q.category==='answerable'?'영상에 답이 있는 질문':'영상에 답이 없는 질문');
 $('#question').textContent=q.question;
 $('#answer').textContent=q.category==='answerable'?'예상 답: '+q.expected_answer:'답 없다고 본 이유: '+q.absence_reason;
 const box=$('#evidence');box.replaceChildren();
 for(const t of q.targets){const v=original.corpus.find(v=>v.video_id===t.video_id);const p=document.createElement('p'),a=document.createElement('a');a.href='https://www.youtube.com/watch?v='+encodeURIComponent(t.video_id)+'&t='+Math.floor(t.start)+'s';a.target='_blank';a.rel='noopener noreferrer';a.textContent=v.title+' · '+time(t.start)+'–'+time(t.end)+' 재생';p.append(a);const quote=document.createElement('blockquote');quote.textContent=t.quote;box.append(p,quote)}
 $('#memo').value=d.memo;
 document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.choice===d.status)));
}
$('#prev').onclick=()=>{index--;render()};$('#next').onclick=()=>{index++;render()};
$('#memo').oninput=()=>{const q=original.questions[index];decisions[q.id]={...state(q),memo:$('#memo').value};persist()};
for(const button of document.querySelectorAll('[data-choice]'))button.onclick=()=>{const q=original.questions[index];decisions[q.id]={...state(q),status:button.dataset.choice,reviewed_at:new Date().toISOString()};persist();render()};
$('#unreviewed').onclick=()=>{const next=original.questions.findIndex(q=>state(q).status==='pending');if(next<0){$('#notice').textContent='미검토 질문이 없어. 수정 필요 항목을 확인하거나 파일로 저장해줘.';return}index=next;render()};
$('#download').onclick=()=>{
 const reviewed=structuredClone(original);reviewed.questions=reviewed.questions.map(q=>({...q,review_status:state(q).status,reviewer_notes:state(q).memo,reviewed_at:state(q).reviewed_at||null}));
 const complete=reviewed.questions.every(q=>q.review_status==='approved');reviewed.status=complete?'frozen':'pending_human_review';reviewed.source_version=original.version;reviewed.version=original.version+'-review-'+new Date().toISOString();reviewed.exported_at=new Date().toISOString();reviewed.search_executed=false;
 const blob=new Blob([JSON.stringify(reviewed,null,2)+'\n'],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=complete?'questions.reviewed.json':'questions.review-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 $('#notice').textContent=complete?'전부 확인한 파일을 저장했어. 이 파일로 평가를 시작할 수 있어.':'진행 내용을 저장했어. 미검토·수정 필요 질문은 아직 확정되지 않았어.';
};render();
</script></html>
