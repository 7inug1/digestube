<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Digestube v2 — 빌드 화면</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #EEF1F5; --surface: #FFFFFF; --surface-2: #E4E9F0;
    --ink: #1A2233; --muted: #5B6472; --faint: #8A93A3; --line: #D2D9E2;
    --blue: #2454A6; --blue-soft: #E4ECFB;
    --green: #2E7D5B; --green-soft: #E4F3EC;
    --red: #B3432F; --red-soft: #FBEAE6;
    --amber: #B8681E; --amber-soft: #FBEEDE;
    --code-bg: #101826; --code-ink: #D7DEEA;
    --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 32px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D131D; --surface: #151D2B; --surface-2: #1C2635;
      --ink: #E3E8F0; --muted: #9AA5B6; --faint: #6C7688; --line: #2A3446;
      --blue: #7FA8F0; --blue-soft: #1B2A47;
      --green: #6FCBA0; --green-soft: #12271E;
      --red: #E38070; --red-soft: #33140F;
      --amber: #E3A34E; --amber-soft: #33270F;
      --code-bg: #0A0F18; --code-ink: #D7DEEA;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system,"Apple SD Gothic Neo",system-ui,sans-serif; font-size: 15px; }
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; height: auto; } }

  .notes-panel { border-right: 1px solid var(--line); overflow-y: auto; background: var(--surface); }
  .notes-panel header { padding: 16px 18px 8px; border-bottom: 1px solid var(--line); }
  .notes-panel h1 { font-size: 15px; margin: 0 0 4px; }
  .notes-panel p { font-size: 13px; color: var(--muted); margin: 0; }
  .tabs { display: flex; flex-direction: column; padding: 8px; gap: 2px; }
  .tabs button { text-align: left; background: none; border: none; padding: 8px 8px; border-radius: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .tabs button:hover { background: var(--surface-2); }
  .tabs button.active { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .note-body { padding: var(--sp-1) 18px 30px; font-size: 14px; line-height: 1.7; }
  .note-body > *:first-child { margin-top: 0 !important; }
  .note-body h1 { font-size: 18px; margin: var(--sp-4) 0 var(--sp-1); }
  .note-body h2 { font-size: 15px; margin: var(--sp-3) 0 var(--sp-1); color: var(--blue); }
  .note-body p { margin: var(--sp-2) 0; color: var(--ink); }
  .note-body ul, .note-body ol { padding-left: 18px; margin: var(--sp-2) 0; }
  .note-body li { margin: var(--sp-1) 0; }
  .note-body code { background: var(--surface-2); padding: 1px 6px; border-radius: 4px; font-size: 13px; }
  .note-body table { border-collapse: collapse; width: 100%; margin: var(--sp-2) 0; font-size: 13px; }
  .note-body th, .note-body td { border-bottom: 1px solid var(--line); padding: 6px 6px; text-align: left; }
  .note-body th { color: var(--faint); font-size: 11px; text-transform: uppercase; }
  .note-body strong { color: var(--ink); }
  .note-body a { color: var(--blue); text-decoration: none; border-bottom: 1px solid var(--blue-soft); }
  .note-body a:hover { border-bottom-color: var(--blue); }
  .note-body blockquote { margin: var(--sp-2) 0; padding: 12px 16px; background: var(--blue-soft); border-left: 3px solid var(--blue); border-radius: 0 8px 8px 0; }
  .note-body blockquote p { margin: 0; }
  .note-body blockquote .tldr-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--blue); text-transform: uppercase; margin-bottom: 4px; }

  .funnel { display: flex; flex-direction: column; gap: var(--sp-3); margin: var(--sp-2) 0; }
  .funnel-row { display: grid; grid-template-columns: 90px 1fr; align-items: start; gap: 12px; }
  .funnel-track { padding-top: 1px; }
  .funnel-bar { background: var(--blue); border-radius: 6px; height: 26px; display: flex; align-items: center; justify-content: center; min-width: 30px; }
  .funnel-n { color: white; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
  .funnel-label { min-width: 0; }
  .funnel-head { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .funnel-tag { font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 1px 6px; border-radius: 100px; }
  .funnel-tag.exclude { background: var(--red-soft); color: var(--red); }
  .funnel-tag.defer { background: var(--amber-soft); color: var(--amber); }
  .funnel-tag.merge { background: var(--blue-soft); color: var(--blue); }
  .funnel-tag.result { background: var(--green-soft); color: var(--green); }
  .funnel-note { font-size: 11px; color: var(--muted); margin-top: 5px; padding-left: 9px; border-left: 2px solid var(--line); }

  .fitem { display: grid; grid-template-columns: 165px 1fr; gap: 3px 10px; align-items: baseline; padding: 3px 0; font-size: 13px; }
  .fitem:first-of-type { margin-top: 6px; }
  .fitem-name { color: var(--ink); }
  .fitem-note { color: var(--faint); font-size: 11px; min-width: 0; }
  .fitem.exclude .fitem-name, .fitem.merge .fitem-name, .fitem.defer .fitem-name {
    color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1.5px;
  }
  .fitem.exclude .fitem-name { text-decoration-color: var(--red); }
  .fitem.merge .fitem-name { text-decoration-color: var(--blue); }
  .fitem.defer .fitem-name { text-decoration-color: var(--amber); }
  .fitem.result .fitem-name { color: var(--green); font-weight: 600; }
  @media (max-width: 620px) { .fitem { grid-template-columns: 1fr; } }

  .steps-nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .steps-nav button { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 16px; font-size: 13px; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
  .steps-nav button:hover { color: var(--ink); }
  .steps-nav button.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }

  .vbar { display: flex; flex-wrap: wrap; gap: 6px; }
  .vbar button { display: flex; align-items: baseline; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 13px; cursor: pointer; }
  .vbar button span { font-size: 11px; color: var(--faint); }
  .vbar button:hover { border-color: var(--blue); color: var(--blue); }
  .vbar button.active { background: var(--blue); border-color: var(--blue); color: white; font-weight: 600; }
  .vbar button.active span { color: rgba(255,255,255,.75); }

  .subtabs { display: flex; gap: 4px; }
  .subtabs button { background: var(--surface-2); border: 1px solid transparent; border-radius: 8px; padding: 6px 16px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .subtabs button.active { background: var(--surface); border-color: var(--line); color: var(--ink); font-weight: 600; }
  .tab-help { font-size: 13px; color: var(--muted); margin: 0; }

  section[data-panel] { display: flex; flex-direction: column; gap: var(--sp-2); }
  [data-tab-panel] { display: flex; flex-direction: column; gap: var(--sp-2); }

  .build-panel { padding: var(--sp-4); overflow-y: auto; display: flex; flex-direction: column; gap: var(--sp-4); }
  .panel-head { display: flex; flex-direction: column; gap: var(--sp-1); }
  .build-panel h1 { font-size: 22px; margin: 0; }
  .build-panel .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: var(--sp-3) var(--sp-3); max-width: 560px; display: flex; flex-direction: column; gap: var(--sp-2); }
  .card label { display: block; font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; margin-bottom: var(--sp-1); }
  .row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 13px; }
  button.go { padding: 8px 16px; border: none; border-radius: 8px; background: var(--blue); color: white; font-weight: 600; font-size: 13px; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: default; }
  .result { padding: 16px 16px; border-radius: 10px; font-size: 13px; }
  .result.ok { background: var(--green-soft); }
  .result.err { background: var(--red-soft); color: var(--red); }
  .result dl { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; margin: 0; }
  .result dt { color: var(--muted); }
  .result dd { margin: 0; }
  .result audio { width: 100%; margin-top: 12px; }
  a.dl { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--blue); text-decoration: none; }
  a.dl:hover { text-decoration: underline; }
  .note-ptr { margin: 10px 0 0; font-size: 11px; color: var(--muted); }

  .steps { display: flex; flex-direction: column; gap: 0; }
  .step { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; color: var(--faint); }
  .step .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); color: var(--faint); font-size: 11px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; transition: background .2s, color .2s; }
  .step.active { color: var(--ink); }
  .step.active .dot { background: var(--blue-soft); color: var(--blue); }
  .step.done { color: var(--ink); }
  .step.done .dot { background: var(--green-soft); color: var(--green); }

  .current-video { background: var(--green-soft); border: 1px solid var(--green); border-radius: 12px; padding: var(--sp-3); max-width: 560px; }
  .cv-label { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .02em; margin-bottom: var(--sp-1); }
  .cv-body { font-size: 13px; }
  .cv-body .cv-title { font-weight: 600; margin-bottom: 2px; }
  .cv-body .cv-sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .cv-body audio { width: 100%; height: 32px; }
  .cv-reset { margin-top: 10px; background: none; border: none; color: var(--muted); font-size: 11px; text-decoration: underline; cursor: pointer; padding: 0; }

  .review-wrap { display: flex; flex-direction: column; gap: var(--sp-2); }
  .review-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .review-picker button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 13px; cursor: pointer; }
  .review-picker button:hover { border-color: var(--blue); color: var(--blue); }
  .review-picker button.active { background: var(--blue); border-color: var(--blue); color: white; font-weight: 600; }
  .review-body { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: var(--sp-3); align-items: start; }
  @media (max-width: 1100px) { .review-body { grid-template-columns: 1fr; } }
  .review-video { position: sticky; top: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
  .yt-box { position: relative; padding-top: 56.25%; border-radius: 10px; overflow: hidden; background: #000; }
  .yt-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .review-note { font-size: 11px; color: var(--muted); padding: 8px 8px; background: var(--surface-2); border-radius: 8px; }
  .review-stat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .review-stat b { color: var(--ink); }
  .review-lines { display: flex; flex-direction: column; gap: 2px; max-height: 70vh; overflow-y: auto; }
  .rline { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: start; padding: 6px 8px; border-radius: 7px; font-size: 14px; line-height: 1.7; }
  .rline:hover { background: var(--surface-2); }
  .rline.ok { background: var(--green-soft); }
  .rline.bad { background: var(--red-soft); }
  .rline-t { background: none; border: none; padding: 0; color: var(--blue); font-family: ui-monospace, monospace; font-size: 11px; cursor: pointer; text-align: left; }
  .rline-t:hover { text-decoration: underline; }
  .rline-text { min-width: 0; color: var(--ink); }
  .rline-btns { display: flex; gap: 3px; }
  .rline-btns button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 26px; height: 24px; font-size: 13px; cursor: pointer; color: var(--muted); padding: 0; }
  .rline.ok .rline-btns button.ok { background: var(--green); border-color: var(--green); color: white; }
  .rline.bad .rline-btns button.bad { background: var(--red); border-color: var(--red); color: white; }
  .rline-memo { grid-column: 2 / 4; margin-top: 5px; width: 100%; padding: 6px 8px; border: 1px solid var(--red); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 13px; }
  .rline-memo::placeholder { color: var(--faint); }

  .diff-wrap { display: flex; flex-direction: column; gap: var(--sp-2); }
  .diff-picker { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
  .diff-group { display: flex; gap: 5px; }
  .diff-group button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 13px; cursor: pointer; }
  .diff-group button:hover { border-color: var(--blue); color: var(--blue); }
  .diff-group button.active { background: var(--blue); border-color: var(--blue); color: white; font-weight: 600; }
  .diff-toggle { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); cursor: pointer; }
  .diff-stat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .diff-stat b { color: var(--ink); }
  .diff-body { font-size: 13px; max-height: 62vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .diff-body:empty { display: none; }
  .diff-none { padding: var(--sp-3); color: var(--muted); text-align: center; }
  .dcols { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  .dpair { display: grid; grid-template-columns: 40px 1fr 40px 1fr; align-items: stretch; }
  .dnum { padding: 4px 8px; text-align: right; color: var(--faint); font-size: 11px; user-select: none; border-right: 1px solid var(--line); }
  .dtxt { padding: 4px 8px; line-height: 1.7; word-break: break-word; min-width: 0; color: var(--ink); font-size: 14px; }
  .dtxt.dright { border-left: 1px solid var(--line); }
  .dpair.chg .dleft, .dpair.chg .dnum:nth-child(1) { background: color-mix(in srgb, var(--red-soft) 60%, transparent); }
  .dpair.chg .dright, .dpair.chg .dnum:nth-child(3) { background: color-mix(in srgb, var(--green-soft) 60%, transparent); }
  .dpair.chg .dleft .d-del { background: var(--red-soft); color: var(--red); font-weight: 600; }
  .dpair.chg .dright .d-ins { background: var(--green-soft); color: var(--green); font-weight: 600; }
  @media (max-width: 900px) {
    .dpair { grid-template-columns: 34px 1fr; }
    .dtxt.dright { border-left: none; border-top: 1px dashed var(--line); }
  }

  .drow { display: grid; grid-template-columns: 34px 1fr; border-bottom: 1px solid var(--line); }
  .drow:last-child { border-bottom: none; }
  .drow-n { padding: 8px 6px; color: var(--faint); font-size: 11px; font-family: ui-monospace, monospace; text-align: right; background: var(--surface-2); }
  .drow-cells { min-width: 0; }
  .dcell { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 6px 8px; line-height: 1.7; min-width: 0; }
  .dcell + .dcell { border-top: 1px dashed var(--line); }
  .dcell-tag { font-size: 11px; font-weight: 700; color: var(--faint); padding-top: 3px; }
  .drow.has-diff .drow-n { background: var(--red-soft); color: var(--red); font-weight: 700; }
  .d-eq { color: var(--muted); }
  .d-del, .d-ins, .d-rep-a, .d-rep-b { padding: 1px 4px; border-radius: 4px; }
  .d-del { background: var(--red-soft); color: var(--red); }
  .d-ins { background: var(--green-soft); color: var(--green); }
  .d-rep-a { background: var(--red-soft); color: var(--red); text-decoration: line-through; }
  .d-rep-b { background: var(--green-soft); color: var(--green); }
  .d-cosmetic { opacity: .45; }
  .semlist { display: flex; flex-direction: column; }
  .semrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); align-items: center; }
  .semrow:last-child { border-bottom: none; }
  .semrow.changed { background: color-mix(in srgb, var(--red-soft) 45%, transparent); }
  .sempair { font-size: 13px; }
  .sem-a { color: var(--ink); }
  .sem-arrow { color: var(--faint); margin: 0 6px; }
  .sem-b { color: var(--ink); }
  .semrow.changed .sem-a { color: var(--red); font-weight: 600; }
  .semrow.changed .sem-b { color: var(--red); font-weight: 600; }
  .semwhy { grid-column: 1; font-size: 11px; color: var(--faint); }
  .sem-fixed { background: var(--blue-soft); color: var(--blue); padding: 1px 6px; border-radius: 100px; font-size: 11px; font-weight: 700; }
  .sembtns { grid-row: 1 / 3; display: flex; gap: 4px; }
  .sembtns button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .sembtns button.on { background: var(--blue); border-color: var(--blue); color: white; font-weight: 600; }
  .diff-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--faint); }

  .chunk-wrap { display: flex; flex-direction: column; gap: var(--sp-2); }
  .chunk-score { overflow-x: auto; }
  .chunk-score table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .chunk-score th, .chunk-score td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
  .chunk-score th:first-child, .chunk-score td:first-child,
  .chunk-score th:nth-child(2), .chunk-score td:nth-child(2) { text-align: left; }
  .chunk-score th { color: var(--faint); font-size: 11px; text-transform: uppercase; }
  .chunk-score .bad { color: var(--red); font-weight: 700; }
  .chunk-score .good { color: var(--green); font-weight: 700; }
  .chunk-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); align-items: start; }
  @media (max-width: 1000px) { .chunk-cols { grid-template-columns: 1fr; } }
  .chunk-col { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
  .chunk-col h4 { margin: 0; padding: 8px 12px; font-size: 13px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .chunk-col h4 span { font-weight: 400; color: var(--muted); font-size: 11px; }
  .chunk-list { max-height: 56vh; overflow-y: auto; }
  .chunk-item { padding: 8px 12px; border-bottom: 1px dashed var(--line); font-size: 14px; line-height: 1.7; color: var(--ink); }
  .chunk-item:last-child { border-bottom: none; }
  .chunk-item.cut { background: color-mix(in srgb, var(--red-soft) 45%, transparent); }
  .chunk-meta { display: block; font-size: 11px; color: var(--faint); margin-bottom: 3px; }
  .chunk-item.cut .chunk-meta { color: var(--red); font-weight: 700; }

  .reqlog-wrap { max-width: 560px; }
  .reqlog-label { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .02em; margin-bottom: var(--sp-1); }
  .reqlog { background: var(--code-bg); border-radius: 10px; padding: 4px 0; font-family: ui-monospace,"SF Mono",Consolas,monospace; font-size: 11px; max-height: 220px; overflow-y: auto; }
  .reqlog-empty { color: var(--faint); padding: 8px 16px; margin: 0; }
  .req-row { display: flex; align-items: center; gap: 8px; padding: 6px 16px; border-bottom: 1px solid rgba(255,255,255,.06); color: var(--code-ink); }
  .req-row:last-child { border-bottom: none; }
  .req-method { flex-shrink: 0; width: 34px; font-weight: 700; }
  .req-method.get { color: var(--code-blue); }
  .req-method.post { color: var(--code-amber); }
  .req-path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  .req-desc { opacity: .6; }
  .req-status { flex-shrink: 0; font-weight: 700; }
  .req-status.pending { color: var(--code-amber); }
  .req-status.ok { color: var(--green); }
  .req-status.err { color: var(--red); }
  .req-ms { flex-shrink: 0; color: var(--faint); width: 46px; text-align: right; }
</style>
</head>
<body>
<div class="app">
  <div class="notes-panel">
    <header>
      <h1>Digestube v2 · 판단 기록</h1>
      <p>기술을 고른 근거</p>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="note-body" id="noteBody">불러오는 중...</div>
  </div>

  <div class="build-panel">
    <nav class="steps-nav" id="stepsNav">
      <button data-step="1">1 · 오디오 추출</button>
      <button data-step="2">2 · 전사</button>
      <button data-step="3">3 · 문단 나누기</button>
    </nav>

    <!-- ── 1단계 ── -->
    <section data-panel="1">

<script>
const API = "http://127.0.0.1:8010";

function mdToHtml(md) {
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines = md.split("\n");
  let html = "", inList = false, inTable = false, tableRows = [], inFunnel = false, funnelRows = [];

  // ```funnel 블록 안의 "숫자|라벨|사유(선택)" 줄을 깔때기 모양 막대로 그린다.
  // 순차 소거 과정(18개 → 15개 → 4개 식)을 표로 나열하는 것보다 한눈에 들어온다.
  const FUNNEL_TAGS = { "제외": "exclude", "보류": "defer", "합침": "merge", "결과": "result" };
  function flushFunnel() {
    if (!funnelRows.length) return;
    const max = Math.max(...funnelRows.map(r => r.n));
    html += '<div class="funnel">';
    funnelRows.forEach(r => {
      const pct = Math.max(14, Math.round((r.n / max) * 100));
      const st = FUNNEL_TAGS[r.tag] || "";
      const notes = (r.notes || []).map(n => `<div class="funnel-note">${inline(n)}</div>`).join("");
      const items = (r.items || []).map(it =>
        `<div class="fitem ${st}"><span class="fitem-name">${inline(it.name)}</span>` +
        `${it.note ? `<span class="fitem-note">${inline(it.note)}</span>` : ""}</div>`).join("");
      html += `<div class="funnel-row">
        <div class="funnel-track"><div class="funnel-bar" style="width:${pct}%"><span class="funnel-n">${r.n}</span></div></div>
        <div class="funnel-label"><span class="funnel-head">${inline(r.label)}` +
        `${r.tag ? `<span class="funnel-tag ${st}">${r.tag}</span>` : ""}</span>${notes}${items}</div>
      </div>`;
    });
    html += '</div>';
    funnelRows = [];
  }

  function flushTable() {
    if (!tableRows.length) return;
    const [head, , ...body] = tableRows;
    const cells = r => r.split("|").slice(1, -1).map(c => c.trim());
    html += "<table><tr>" + cells(head).map(c => `<th>${c}</th>`).join("") + "</tr>";
    body.forEach(r => { html += "<tr>" + cells(r).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>"; });
    html += "</table>";
    tableRows = [];
  }
  function inline(s) {
    s = esc(s);
    s = s.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/`(.+?)`/g, "<code>$1</code>");
    return s;
  }
  for (const raw of lines) {
    const line = raw;
    if (/^```funnel/.test(line)) { inFunnel = true; continue; }
    if (inFunnel) {
      if (/^```/.test(line)) { inFunnel = false; flushFunnel(); continue; }
      // "↳ " 로 시작하면 숫자 줄이 아니라 바로 위 막대에 붙는 메모다(별도 문단으로
      // 안 빼고 흐름 안에서 바로 보이게 하려는 용도).
      if (/^\s*↳/.test(line)) {
        const last = funnelRows[funnelRows.length - 1];
        if (last) { last.notes = last.notes || []; last.notes.push(line.replace(/^\s*↳\s*/, "")); }
        continue;
      }
      if (/^\s*-\s+/.test(line)) {
        const last = funnelRows[funnelRows.length - 1];
        const [name, note] = line.replace(/^\s*-\s+/, "").split("|").map(s => s?.trim());
        if (last && name) { last.items = last.items || []; last.items.push({ name, note }); }
        continue;
      }
      const [n, label, tag] = line.split("|").map(s => s?.trim());
      if (n) funnelRows.push({ n: parseInt(n, 10), label, tag });
      continue;
    }
    if (/^\|/.test(line)) { inTable = true; tableRows.push(line); continue; }
    else if (inTable) { flushTable(); inTable = false; }

    if (/^# /.test(line)) html += `<h1>${inline(line.slice(2))}</h1>`;
    else if (/^## /.test(line)) html += `<h2>${inline(line.slice(3))}</h2>`;
    else if (/^### /.test(line)) html += `<h2 style="font-size:13.5px">${inline(line.slice(4))}</h2>`;
    else if (/^>\s+/.test(line)) {
      let body = line.replace(/^>\s+/, "");
      let label = "";
      const m = body.match(/^\*\*(TL;?DR|요약)\*\*:?\s*/i);
      if (m) { label = m[1].toUpperCase(); body = body.slice(m[0].length); }
      html += `<blockquote>${label ? `<span class="tldr-label">${label}</span>` : ""}<p>${inline(body)}</p></blockquote>`;
    }
    else if (/^-\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inline(line.replace(/^-\s+/, ""))}</li>`;
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      if (/^\d+\.\s/.test(line)) html += `<p>${inline(line)}</p>`;
      else if (line.trim()) html += `<p>${inline(line)}</p>`;
    }
  }
  if (inList) html += "</ul>";
  flushTable();
  return html;
}

// API 요청 devtools 안 열어도 화면에서 보이게 한다.
let reqSeq = 0;
function logRequest(method, path, desc) {
  const log = document.getElementById("reqlog");
  log.querySelector(".reqlog-empty")?.remove();
  const id = `req-${++reqSeq}`;
  const row = document.createElement("div");
  row.className = "req-row";
  row.id = id;
  row.innerHTML = `<span class="req-method ${method.toLowerCase()}">${method}</span>
    <span class="req-path">${path}${desc ? `<span class="req-desc"> — ${desc}</span>` : ""}</span>
    <span class="req-status pending">진행중</span>
    <span class="req-ms"></span>`;
  log.prepend(row);
  const t0 = performance.now();
  return {
    ok(note) {
      const ms = Math.round(performance.now() - t0);
      row.querySelector(".req-status").className = "req-status ok";
      row.querySelector(".req-status").textContent = note || "200 OK";
      row.querySelector(".req-ms").textContent = `${ms}ms`;
    },
    err(note) {
      const ms = Math.round(performance.now() - t0);
      row.querySelector(".req-status").className = "req-status err";
      row.querySelector(".req-status").textContent = note || "실패";
      row.querySelector(".req-ms").textContent = `${ms}ms`;
    },
  };
}
// <audio src="..."> 로딩은 fetch()가 아니라 브라우저가 알아서 GET을 보내므로
// 직접 가로챌 수 없다. loadstart(요청 시작)·canplay(응답 받아 재생 준비됨)·
// error 이벤트로 대신 감지해서 로그에 남긴다.
function wireAudioLog(audio, path) {
  let log = null;
  audio.addEventListener("loadstart", () => { log = logRequest("GET", path, "추출된 오디오 파일 자체를 받아옴"); });
  audio.addEventListener("canplay", () => log?.ok("재생 준비됨"));
  audio.addEventListener("error", () => log?.err("로드 실패"));
}

// 지금 작업 중인 영상 — localStorage에 저장해서 새로고침해도, 나중에
// 2단계(전사)·3단계(청킹)를 만들어도 같은 영상 기준으로 이어서 볼 수 있게 한다.
const CV_KEY = "digestube_current_video";
function saveCurrentVideo(data) {
  localStorage.setItem(CV_KEY, JSON.stringify(data));
  renderCurrentVideo(data);
}
function loadCurrentVideo() {
  const raw = localStorage.getItem(CV_KEY);
  if (!raw) return;
  try { renderCurrentVideo(JSON.parse(raw)); } catch {}
}
function renderCurrentVideo(data) {
  const box = document.getElementById("currentVideo");
  const body = document.getElementById("cvBody");
  const audioUrl = `${API}/api/audio/${data.id}`;
  body.innerHTML = `
    <div class="cv-title">${data.title}</div>
    <div class="cv-sub">${data.channel ?? ""} · ${data.duration_sec ? Math.round(data.duration_sec) + "초" : ""} · ${data.audio_file}</div>
    <audio controls preload="none" src="${audioUrl}"></audio>
    <a class="dl" href="${audioUrl}" download="${data.audio_file}">오디오 파일 다운로드</a>`;
  box.style.display = "block";
  wireAudioLog(body.querySelector("audio"), `/api/audio/${data.id}`);
}
document.getElementById("cvReset").onclick = () => {
  localStorage.removeItem(CV_KEY);
  document.getElementById("currentVideo").style.display = "none";
};
loadCurrentVideo();

// 노트 선택 상태를 URL 해시(#02-stt)에 반영한다 — 새로고침해도 방금 보던
// 탭이 유지되고, 이 URL 자체를 그 노트로 가는 링크로도 쓸 수 있다.
// ── 정답 검수 ────────────────────────────────────────────────────
// 영상과 자막을 나란히 놓고 한 줄씩 대조한다. 시각을 누르면 그 지점부터 재생되고,
// ○/✕ 로 판정을 남기면 서버에 바로 저장된다(work/review_marks.json).
let reviewData = null;

function ytSeek(sec) {
  const f = document.getElementById("ytFrame");
  f.contentWindow.postMessage(JSON.stringify({
    event: "command", func: "seekTo", args: [Math.max(0, sec - 0.5), true],
  }), "*");
  f.contentWindow.postMessage(JSON.stringify({
    event: "command", func: "playVideo", args: [],
  }), "*");
}

function renderReviewStat() {
  const marks = reviewData.marks || {};
  const vals = Object.values(marks);
  const ok = vals.filter(v => v.verdict === "ok").length;
  const bad = vals.filter(v => v.verdict === "bad").length;
  const total = reviewData.lines.length;
  document.getElementById("reviewStat").innerHTML =
    `<b>${ok + bad}</b> / ${total}줄 확인 &nbsp;·&nbsp; 맞음 <b>${ok}</b> &nbsp;·&nbsp; 틀림 <b>${bad}</b>`;
}

async function saveMark(i, verdict, memo) {
  const log = logRequest("POST", `/api/review/${reviewData.id}/mark`, `${i}번 줄 판정`);
  const r = await fetch(`${API}/api/review/${reviewData.id}/mark`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ index: i, verdict, memo }),
  });
  if (r.ok) log.ok(`${r.status}`); else log.err(`${r.status}`);
  return r.ok;
}

async function markLine(i, verdict) {
  const marks = reviewData.marks;
  const next = marks[i]?.verdict === verdict ? "" : verdict;
  const memo = marks[i]?.memo || "";
  if (!(await saveMark(i, next, next ? memo : ""))) return;
  if (next) marks[i] = { verdict: next, memo }; else delete marks[i];

  const row = document.querySelector(`.rline[data-i="${i}"]`);
  row.className = `rline ${next}`;
  // ✕ 로 표시한 줄에만 "뭐가 틀렸는지" 입력창을 띄운다. 틀렸다는 사실만으론
  // 나중에 자막을 고칠 수 없어서, 실제로 뭐라고 말하는지를 같이 받아둔다.
  const input = row.querySelector(".rline-memo");
  input.hidden = next !== "bad";
  if (next === "bad") input.focus();
  renderReviewStat();
}

async function saveMemo(i, memo) {
  const cur = reviewData.marks[i];
  if (!cur) return;
  if (!(await saveMark(i, cur.verdict, memo))) return;
  cur.memo = memo;
}

function renderReview() {
  const d = reviewData;
  document.getElementById("reviewBody").style.display = "grid";
  document.getElementById("reviewNote").textContent = d.note;
  document.getElementById("ytFrame").src =
    `https://www.youtube.com/embed/${d.video_id}?enablejsapi=1&rel=0`;
  document.getElementById("reviewLines").innerHTML = d.lines.map((ln, i) => {
    const m = d.marks[i]?.verdict || "";
    const mm = `${String(Math.floor(ln.t / 60)).padStart(2, "0")}:${String(Math.floor(ln.t % 60)).padStart(2, "0")}`;
    const memo = d.marks[i]?.memo || "";
    return `<div class="rline ${m}" data-i="${i}">
      <button class="rline-t" data-seek="${ln.t}">${mm}</button>
      <span class="rline-text">${ln.text.replace(/</g, "&lt;")}</span>
      <span class="rline-btns">
        <button class="ok" data-mark="ok" data-i="${i}" title="자막이 말과 맞음">○</button>
        <button class="bad" data-mark="bad" data-i="${i}" title="자막이 말과 다름">✕</button>
      </span>
      <input class="rline-memo" data-memo="${i}" value="${memo.replace(/"/g, "&quot;")}"
             placeholder="실제로 뭐라고 말하는지, 또는 뭐가 틀렸는지"
             ${m === "bad" ? "" : "hidden"} />
    </div>`;
  }).join("");
  document.querySelectorAll("[data-seek]").forEach(b =>
    b.onclick = () => ytSeek(parseFloat(b.dataset.seek)));
  document.querySelectorAll("[data-mark]").forEach(b =>
    b.onclick = () => markLine(parseInt(b.dataset.i, 10), b.dataset.mark));
  document.querySelectorAll("[data-memo]").forEach(inp => {
    const save = () => saveMemo(parseInt(inp.dataset.memo, 10), inp.value.trim());
    // blur 에만 저장하면 타이핑 도중 탭을 옮길 때 날아간다. 입력이 멎고 600ms 뒤
    // 자동 저장해서, 어디로 넘어가든 마지막 입력까지는 남게 한다.
    let timer = null;
    inp.oninput = () => { clearTimeout(timer); timer = setTimeout(save, 600); };
    inp.onblur = () => { clearTimeout(timer); save(); };
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } };
  });
  renderReviewStat();
}

async function loadReview(rid) {
  document.querySelectorAll("#reviewPicker button")
    .forEach(b => b.classList.toggle("active", b.dataset.rid === rid));
  const log = logRequest("GET", `/api/review/${rid}`, "검수용 자막 불러오기");
  const r = await fetch(`${API}/api/review/${rid}`);
  const d = await r.json();
  if (!r.ok) { log.err(`${r.status}`); return; }
  log.ok(`${r.status} · ${d.lines.length}줄`);
  reviewData = d;
  renderReview();
}


// ── 오차 대조 ────────────────────────────────────────────────────
// 정답과 STT 결과를 낱말 단위로 맞춰 다른 부분만 색으로 보여준다.
// 빨강(취소선)=정답에 있는데 STT가 놓친 말, 초록=STT가 더 넣은 말.
const DIFF_CANDS = [["mlx", "mlx-whisper"], ["groq", "Groq"], ["auto", "유튜브 자동자막"]];
let diffCand = "mlx", diffData = null;

let diffView = "full";   // full = 나란히 대조 · sem = 의미 오류

function renderDiff() {
  const hide = document.getElementById("diffHideCosmetic").checked;
  const body = document.getElementById("diffBody");
  if (!diffData) { body.innerHTML = ""; return; }
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

  // 한 쪽(정답 또는 STT)의 글만 골라 이어붙인다. 그래야 각각을 끊김 없이
  // 읽을 수 있고, 다른 쪽과 어긋나는 부분에만 색이 얹힌다.
  const side = (ops, which) => ops.map(o => {
    const txt = which === "truth" ? o.truth : o.hyp;
    if (!txt) return "";
    if (o.op === "equal") return esc(txt);
    if (hide && o.cosmetic) return esc(txt);
    const cls = which === "truth" ? "d-del" : "d-ins";
    return `<span class="${cls}${o.cosmetic ? " d-cosmetic" : ""}">${esc(txt)}</span>`;
  }).filter(Boolean).join(" ");

  document.getElementById("cosmeticToggle").style.display = diffView === "sem" ? "none" : "";
  if (diffView === "sem") { renderSemantic(); return; }
  if (diffView === "full") {
    // 양쪽에 줄번호를 두고, 바뀐 줄은 행 전체에 옅은 배경을 깔고 그 안에서
    // 실제로 다른 낱말만 진한 색으로 덧칠한다(왼쪽 빨강 · 오른쪽 초록).
    body.innerHTML = `
      <div class="dcols">
        ${diffData.rows.map((r, i) => {
          const cls = r.diffs ? " chg" : "";
          const a = side(r.ops, "truth");
          const b = side(r.ops, "hyp");
          return `<div class="dpair${cls}">
            <span class="dnum">${i + 1}</span><div class="dtxt dleft">${a || "&nbsp;"}</div>
            <span class="dnum">${i + 1}</span><div class="dtxt dright">${b || "&nbsp;"}</div>
          </div>`;
        }).join("")}
      </div>`;
  }

  const total = diffData.rows.length;
  const bad = diffData.rows.filter(r => r.diffs > 0).length;
  document.getElementById("diffStat").innerHTML =
    `<b>${diffData.label}</b> · CER <b>${diffData.cer}%</b> · 정답 ${diffData.truth_chars.toLocaleString()}자 · ` +
    `${total}줄 중 <b>${bad}</b>줄에서 차이, 실제 오차 <b>${diffData.real_diffs}</b>곳`;
}

async function loadDiff() {
  document.querySelectorAll("#diffCands button").forEach(b => b.classList.toggle("active", b.dataset.v === diffCand));
  document.getElementById("diffStat").textContent = "전사 돌리는 중...";
  document.getElementById("diffBody").innerHTML = "";
  const path = `/api/diff/${encodeURIComponent(curVideo.diff)}/${diffCand}`;
  const log = logRequest("GET", path, "정답 대비 오차 계산");
  const r = await fetch(`${API}${path}`);
  const d = await r.json();
  if (!r.ok) { log.err(`${r.status}`); document.getElementById("diffStat").textContent = d.detail || "실패"; return; }
  log.ok(`${r.status} · CER ${d.cer}%`);
  diffData = d;
  semData = null;
  if (diffView === "sem") loadSemantic(); else renderDiff();
}


// ── 의미 오류 판정 ────────────────────────────────────────────────
// CER은 표기 차이(콘텐츠/컨텐츠)와 뜻이 바뀐 오류(체류시간/치료시간)를 똑같이
// 센다. 검색·요약에서 실제로 문제가 되는 건 뒤엣것뿐이라 따로 세고, LLM 판정을
// 사람이 고칠 수 있게 한다(정답 자막을 검수했던 것과 같은 구조).
let semData = null;

async function overrideSem(i, changed) {
  const path = `/api/semantic/${encodeURIComponent(curVideo.diff)}/${diffCand}/override`;
  const log = logRequest("POST", path, `${i}번 판정 수정`);
  const r = await fetch(`${API}${path}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ index: i, changed }),
  });
  if (!r.ok) { log.err(`${r.status}`); return; }
  const d = await r.json();
  log.ok(`${r.status}`);
  const p = semData.pairs.find(x => x.i === i);
  p.changed = changed; p.fixed = true;
  semData.changed = d.changed;
  renderSemantic();
}

function renderSemantic() {
  const body = document.getElementById("diffBody");
  const stat = document.getElementById("diffStat");
  if (!semData) { body.innerHTML = ""; stat.textContent = "판정 중..."; return; }
  const esc = s => (s || "(없음)").replace(/&/g, "&amp;").replace(/</g, "&lt;");

  body.innerHTML = `<div class="semlist">${semData.pairs.map(p => `
    <div class="semrow${p.changed ? " changed" : ""}">
      <div class="sempair">
        <span class="sem-a">${esc(p.truth)}</span>
        <span class="sem-arrow">→</span>
        <span class="sem-b">${esc(p.hyp)}</span>
      </div>
      <div class="semwhy">${esc(p.why)}${p.fixed ? ' <span class="sem-fixed">사람이 고침</span>' : ""}</div>
      <div class="sembtns">
        <button data-sem="${p.i}" data-v="1" class="${p.changed ? "on" : ""}">뜻 바뀜</button>
        <button data-sem="${p.i}" data-v="0" class="${p.changed ? "" : "on"}">같은 뜻</button>
      </div>
    </div>`).join("")}</div>`;

  document.querySelectorAll("[data-sem]").forEach(b =>
    b.onclick = () => overrideSem(parseInt(b.dataset.sem, 10), b.dataset.v === "1"));

  const n = semData.pairs.length;
  stat.innerHTML = `<b>${DIFF_CANDS.find(c => c[0] === diffCand)[1]}</b> · ` +
    `CER <b>${semData.cer}%</b> · 차이 ${n}곳 중 <b>뜻이 바뀐 것 ${semData.changed}곳</b>` +
    `<div class="diff-legend">Claude가 판정한 결과다. 틀린 판정은 버튼으로 고치면 저장된다.</div>`;
}

async function loadSemantic() {
  semData = null;
  renderSemantic();
  const path = `/api/semantic/${encodeURIComponent(curVideo.diff)}/${diffCand}`;
  const log = logRequest("GET", path, "뜻이 바뀐 오류만 판정");
  const r = await fetch(`${API}${path}`);
  const d = await r.json();
  if (!r.ok) { log.err(`${r.status}`); document.getElementById("diffStat").textContent = d.detail || "실패"; return; }
  log.ok(`${r.status} · ${d.changed}곳`);
  semData = d;
  renderSemantic();
}

// ── 문단 나누기 비교 ──────────────────────────────────────────────
// 문단은 검색 결과로 나오는 단위다. 문장 중간에서 끊기면 검색에 걸려도 말이
// 안 통하고, 길이가 들쭉날쭉하면 어떤 문단은 뜻이 없고 어떤 문단은 여러 얘기가
// 섞인다. 숫자만으로는 감이 안 와서 실제로 나뉜 문단을 그대로 보여준다.

async function loadChunks() {
  document.querySelectorAll("#chunkSrc button").forEach(b => b.classList.toggle("active", b.dataset.v === chunkSrc));
  const target = document.getElementById("chunkTarget").value || 340;
  const path = `/api/chunk/${encodeURIComponent(chunkSrc)}?target=${target}`;
  const log = logRequest("GET", `/api/chunk/${chunkSrc}`, "세 방법으로 나눠보기");
  const r = await fetch(`${API}${path}`);
  const d = await r.json();
  if (!r.ok) { log.err(`${r.status}`); document.getElementById("chunkScore").textContent = d.detail || "실패"; return; }
  log.ok(`${r.status}`);

  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const rows = Object.entries(d.methods).map(([k, m]) => {
    const s = m.score;
    const cut = s.broken_pct > 0 ? "bad" : "good";
    const even = s.stdev > 80 ? "bad" : "good";
    return `<tr><td><b>${k}</b></td><td>${m.label}</td><td>${s.count}</td>
      <td class="${cut}">${s.broken}건 (${s.broken_pct}%)</td>
      <td>${s.avg}자</td><td>${s.min}~${s.max}자</td>
      <td class="${even}">±${s.stdev}</td></tr>`;
  }).join("");
  document.getElementById("chunkScore").innerHTML = `
    <table><tr><th></th><th>방법</th><th>문단 수</th><th>① 문장 중간 끊김</th>
    <th>평균 길이</th><th>② 최소~최대</th><th>길이 편차</th></tr>${rows}</table>
    <div class="diff-legend">원문 ${d.chars.toLocaleString()}자 · 목표 ${d.target}자 · ③(한 얘기만)은 판정이 필요해 아직 없음</div>`;

  document.getElementById("chunkCols").innerHTML = Object.entries(d.methods).map(([k, m]) => `
    <div class="chunk-col">
      <h4>${k}. ${m.label} <span>${m.score.count}개</span></h4>
      <div class="chunk-list">${m.chunks.map((c, i) => {
        const cut = c.trim() && !/[.!?。？！]$/.test(c.trim()) && i < m.chunks.length - 1;
        return `<div class="chunk-item${cut ? " cut" : ""}">
          <span class="chunk-meta">${i + 1}번 · ${c.length}자${cut ? " · 문장 중간에서 끊김" : ""}</span>
          ${esc(c)}</div>`;
      }).join("")}</div>
    </div>`).join("");
}


// ── 화면 구성 ────────────────────────────────────────────────────
// 이 앱은 파이프라인을 한 단계씩 만들어가는 도구다. 그래서 화면도 단계를
// 뼈대로 잡는다. 2단계(전사)의 "정답 검수"와 "결과 비교"는 같은 영상에 대한
// 앞뒤 작업이라 영상 선택을 하나로 공유한다 — 예전엔 각각 따로 골라야 했다.
const VIDEOS = [
  { rid: "korea-univ", diff: "고려대", label: "고려대 9분", lang: "한국어" },
  { rid: "pbs",        diff: "PBS",    label: "PBS 2.5분",  lang: "영어" },
  { rid: "sebasi",     diff: "세바시",  label: "세바시 13분", lang: "한국어" },
];
let curVideo = VIDEOS[0];
let step2Tab = "review";
let chunkSrc = "고려대";

function showStep(n) {
  document.querySelectorAll("#stepsNav button").forEach(b => b.classList.toggle("active", b.dataset.step === n));
  document.querySelectorAll("[data-panel]").forEach(s => s.style.display = s.dataset.panel === n ? "" : "none");
  if (n === "2") loadStep2();
  if (n === "3") loadChunks();
}

function showStep2Tab(tab) {
  step2Tab = tab;
  document.querySelectorAll("#step2Tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll("[data-tab-panel]").forEach(s => s.style.display = s.dataset.tabPanel === tab ? "" : "none");
  loadStep2();
}

function loadStep2() {
  document.querySelectorAll("#videoBar button").forEach(b =>
    b.classList.toggle("active", b.dataset.rid === curVideo.rid));
  if (step2Tab === "review") loadReview(curVideo.rid);
  else if (diffView === "sem") loadSemantic();
  else loadDiff();
}

(() => {
  document.getElementById("videoBar").innerHTML = VIDEOS.map(v =>
    `<button data-rid="${v.rid}">${v.label}<span>${v.lang}</span></button>`).join("");
  document.querySelectorAll("#videoBar button").forEach(b => b.onclick = () => {
    curVideo = VIDEOS.find(v => v.rid === b.dataset.rid);
    diffData = null; semData = null;
    loadStep2();
  });
  document.querySelectorAll("#stepsNav button").forEach(b => b.onclick = () => showStep(b.dataset.step));
  document.querySelectorAll("#diffViews button").forEach(b => b.onclick = () => {
    diffView = b.dataset.view;
    document.querySelectorAll("#diffViews button").forEach(x => x.classList.toggle("active", x === b));
    if (diffView === "sem" && !semData) loadSemantic(); else renderDiff();
  });
  document.querySelectorAll("#step2Tabs button").forEach(b => b.onclick = () => showStep2Tab(b.dataset.tab));

  document.getElementById("diffCands").innerHTML = DIFF_CANDS.map(([v, label]) =>
    `<button data-v="${v}">${label}</button>`).join("");
  document.querySelectorAll("#diffCands button").forEach(b => b.onclick = () => {
    diffCand = b.dataset.v; diffData = null; semData = null; loadStep2();
  });

  document.getElementById("chunkSrc").innerHTML = ["고려대", "PBS"]
    .map(v => `<button data-v="${v}">${v}</button>`).join("");
  document.querySelectorAll("#chunkSrc button").forEach(b =>
    b.onclick = () => { chunkSrc = b.dataset.v; loadChunks(); });
  document.getElementById("chunkTarget").onchange = loadChunks;

  showStep2Tab("review");
  showStep("1");
})();

let notes = [];
async function loadNotes() {
  notes = await (await fetch(`${API}/api/notes`)).json();
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = notes.map(n => `<button data-id="${n.id}">${n.title}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b => b.onclick = () => { location.hash = b.dataset.id; });
  const fromHash = location.hash.replace(/^#/, "");
  const startId = notes.find(n => n.id === fromHash)?.id
    || notes.find(n => n.id.includes("yt-dlp"))?.id
    || notes[0]?.id;
  if (startId) selectNote(startId);
}
window.addEventListener("hashchange", () => {
  const id = location.hash.replace(/^#/, "");
  if (notes.find(n => n.id === id)) selectNote(id);
});
async function selectNote(id) {
  if (location.hash.replace(/^#/, "") !== id) location.hash = id;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  const log = logRequest("GET", `/api/notes/${id}`, "왼쪽 노트 내용 불러오기");
  const r = await fetch(`${API}/api/notes/${id}`);
  const { content } = await r.json();
  log.ok(`${r.status}`);
  document.getElementById("noteBody").innerHTML = mdToHtml(content);
}
loadNotes();

document.getElementById("go").onclick = async () => {
  const url = document.getElementById("url").value.trim();
  const btn = document.getElementById("go");
  const out = document.getElementById("result");
  if (!url) return;
  const steps = document.querySelectorAll("#steps .step");
  const setStep = (n, cls) => {
    steps.forEach(s => s.classList.remove("active", "done"));
    steps.forEach(s => { if (+s.dataset.s < n) s.classList.add("done"); });
    if (cls) steps[n - 1]?.classList.add(cls);
  };
  setStep(1, "done");
  btn.disabled = true; btn.textContent = "추출 중...";
  out.innerHTML = "";
  try {
    setStep(2, "active");
    const log = logRequest("POST", "/api/extract", "yt-dlp 실행해서 오디오 추출");
    const r = await fetch(`${API}/api/extract`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    const data = await r.json();
    if (!r.ok) { log.err(`${r.status}`); throw new Error(data.detail || "실패"); }
    log.ok(`${r.status} · yt-dlp 완료`);
    setStep(3, "done"); steps[2]?.classList.add("done");
    saveCurrentVideo(data);
    out.innerHTML = `<div class="result ok"><dl>
      <dt>제목</dt><dd>${data.title}</dd>
      <dt>채널</dt><dd>${data.channel}</dd>
      <dt>길이</dt><dd>${data.duration_sec ? Math.round(data.duration_sec) + "초" : "-"}</dd>
      <dt>파일</dt><dd>${data.audio_file} (${data.size_kb} KB)</dd>
    </dl>
    <p class="note-ptr">↑ 위 "현재 작업 영상" 카드에서 바로 재생·다운로드할 수 있음 — 플레이어를 두 번 안 그림</p>
    </div>`;
  } catch (e) {
    out.innerHTML = `<div class="result err">${e.message}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "추출";
  }
};
</script>
</body>
</html>
