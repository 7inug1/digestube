<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 속이 꽉 찬 D 를 가로 다섯 줄로 썬 모양. 브랜드 첫 글자이면서 "영상이 글 줄이 된다".
       재생 삼각형(▶)으로도 그려 봤다 — 16px 에서는 ▶ 가 더 잘 남지만 D 로 안 읽혀서
       D 를 택했다. 16px 에서는 줄무늬 덩어리, 32px 부터 D 와 줄이 보인다.
       줄 간격 30 — 20 이면 32px 에서 줄이 붙어 회색이 된다. -->
